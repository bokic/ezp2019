name: Ubuntu PPA Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (X.Y.Z) to package and upload'
        required: true
        type: string

jobs:
  ppa-upload:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')

    steps:
      - name: Validate version and secrets
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not in X.Y.Z format"
            exit 1
          fi
          if [ -z "${{ secrets.LAUNCHPAD_PPA }}" ]; then
            echo "::error::Secret LAUNCHPAD_PPA is not set (e.g. ppa:yourname/ezp2019)"
            exit 1
          fi
          if [ -z "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "::error::Secret GPG_PRIVATE_KEY is not set"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            devscripts \
            debhelper \
            dpkg-dev \
            dput \
            distro-info \
            distro-info-data

      - name: Import GPG key
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PASSPHRASE" ]; then
            PASS_FILE=$(mktemp)
            chmod 600 "$PASS_FILE"
            printf '%s' "$GPG_PASSPHRASE" > "$PASS_FILE"
            printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --pinentry-mode loopback --passphrase-file "$PASS_FILE" --import
            rm -f "$PASS_FILE"
          else
            printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fi
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          if [ -z "$KEY_ID" ]; then
            echo "::error::Failed to extract GPG key ID from GPG_PRIVATE_KEY"
            exit 1
          fi
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"

      - name: Determine supported Ubuntu series (>= 24.04)
        id: series
        run: |
          SUPPORTED=$(ubuntu-distro-info --supported)
          TARGET_SERIES=""
          for s in $SUPPORTED; do
            ver=$(awk -F, -v codename="$s" '$3 == codename {print $1}' /usr/share/distro-info/ubuntu.csv | sed 's/ LTS//')
            if [ -n "$ver" ] && awk -v v="$ver" 'BEGIN { exit !(v + 0 >= 24.04) }'; then
              TARGET_SERIES="$TARGET_SERIES $s"
            fi
          done
          TARGET_SERIES=$(echo "$TARGET_SERIES" | xargs)
          echo "Target Ubuntu series: $TARGET_SERIES"
          echo "list=$TARGET_SERIES" >> "$GITHUB_OUTPUT"

      - name: Build and upload source packages to PPA
        env:
          DEBFULLNAME: "Boris Barbulovski"
          DEBEMAIL: "bbarbulovski@gmail.com"
          GPG_KEY_ID: ${{ steps.gpg.outputs.key_id }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          LAUNCHPAD_PPA: ${{ secrets.LAUNCHPAD_PPA }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          TARGET_SERIES: ${{ steps.series.outputs.list }}
        run: |
          set -euo pipefail

          # Pull debian/ packaging from the ubuntu branch
          git fetch origin ubuntu
          git checkout origin/ubuntu -- debian/

          # Create upstream orig tarball from the tagged commit (without debian/)
          ORIG_TAR="../ezp2019_${VERSION}.orig.tar.gz"
          git archive --format=tar.gz --prefix="ezp2019-${VERSION}/" HEAD -- ':!debian' > "$ORIG_TAR"

          SIGN_CMD="/tmp/gpg-sign.sh"
          if [ -n "$GPG_PASSPHRASE" ]; then
            PASS_FILE=$(mktemp)
            chmod 600 "$PASS_FILE"
            printf '%s' "$GPG_PASSPHRASE" > "$PASS_FILE"
            printf '%s\n' '#!/bin/sh' "exec gpg --batch --pinentry-mode loopback --passphrase-file \"$PASS_FILE\" \"\$@\"" > "$SIGN_CMD"
          else
            printf '%s\n' '#!/bin/sh' 'exec gpg --batch --pinentry-mode loopback "$@"' > "$SIGN_CMD"
          fi
          chmod +x "$SIGN_CMD"

          for series in $TARGET_SERIES; do
            echo "=== Packaging for Ubuntu $series ==="
            rm -f debian/changelog
            dch --create \
              --package ezp2019 \
              --newversion "${VERSION}-1~${series}1" \
              --distribution "${series}" \
              --force-distribution \
              "Release EZP2019 ${VERSION} for Ubuntu ${series}."

            dpkg-buildpackage -S -sa -d -k"${GPG_KEY_ID}" -p"${SIGN_CMD}"

            for attempt in 1 2 3; do
              if dput -u "${LAUNCHPAD_PPA}" "../ezp2019_${VERSION}-1~${series}1_source.changes"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::dput failed for ${series} after 3 attempts"
                exit 1
              fi
              echo "dput failed (attempt $attempt), retrying in 10s..."
              sleep 10
            done
            sleep 5
          done
